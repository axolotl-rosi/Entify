name: Android security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reject legacy JavaScript bridges
        shell: bash
        run: |
          if rg --glob '*.kt' 'addJavascriptInterface' app/src/main; then
            echo 'Legacy JavaScript bridge found.' >&2
            exit 1
          fi

      - name: Run tests, lint, and release build
        env:
          ENTIFY_SIGNING_MODE: legacy
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Record release checksum
        shell: bash
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: entify-release-verification
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            app/build/reports/lint-results-debug.html
